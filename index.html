<!DOCTYPE html>
<html lang="en">

<head>
  <title>Elden Ring Progression</title>
  <meta charset="utf-8" />
  <meta name="application-name" content="Elden Ring Progression Tracker" />
  <meta name="description" content="Check your Elden Ring progression and hunt down missing items on your way to lordship!" />
  <meta name="keywords" content="Gaming, Elden Ring, FromSoft, Soulslike, Dark Souls, Progression Tracking," />
  <meta name="author" content="Valentin Weber" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="license" href="https://www.gnu.org/licenses/gpl-3.0-standalone.html">
  <link rel="icon" href="assets/images/favicon.ico" />
  <link href="assets/style.css" type="text/css" rel="stylesheet" />
  <script type="text/javascript" src="index.js"></script>
</head>
<body>

  <header>
    <img src="assets/images/logo.png" alt="Elden Ring Logo" class="logo" />
    <h1 class="title">Completion Tracker</h1>
  </header>

  <main>
    <section id="formSection">

      <h2>Elden Ring Savefile</h2>

      <form id="saveFileUploadForm">
        <label id="saveFileLabel">
          <span id="saveFileLabelText">
            <strong role="heading" aria-level="3">Upload File</strong><br />
            It is usually located in<br />
            <i>%APPDATA%</i>/EldenRing/76561198036462776/ER0000.sl2
          </span>
          <input id="saveFileInput"
            type="file"
            accept=".sl2, .co2"
            style="display: none;"
          />
        </label>
      </form>

      <form style="display: none" id="characterSelectForm">
        <h3 id="selectLabel">Select Character</h3>
        <select aria-labelledby="selectLabel" id="characterSelectInput">
          <option selected><!-- Empty Display-Only Option --></option>
          <!-- Populated by character options read from the savefile -->
        </select>
      </form>

    </section>

    <section id="resultSection" style="display: none">

      <h2 id="globalCompletion">
        <!-- Character Name • Completion % -->
      </h2>

      <form
        id="viewModifiers"
        role="toolbar"
        aria-label="view-modifiers"
      >
        <label
          for="showMissingItemDetails"
          title="Toggle visibility of details for missing items"
        >
          Item Details
          <input
            id="showMissingItemDetails"
            type="checkbox"
            onclick="toggleMissingItemsDetails(this.checked)"
          />
        </label>

        <label
          for="showOnlyNotFound"
          title="Toggle visibility of items the character has collected"
        >
          Missing Items Only
          <input
            id="showOnlyNotFound"
            type="checkbox"
            onclick="toggleShowOnlyNotFoundItems(this.checked)"
          />
        </label>
        
        <label
          for="showItems[foe]"
          title="Toggle visibility of items obtained through farming"
          class="icon-text"
        >
          &#xF076E;
        </label>

        <label
          for="showFilters"
          title="Show advanced filter options"
          class="icon-text"
        >
          &#xF1AA3;
          <input
            id="showFilters"
            type="checkbox"
            onclick="showItemFilters(this.checked)"
          />
        </label>

        <label
          for="expandSections"
          title="Expand all sections"
          class="icon-text"
        >
          &#xF0AB4;
          <input
            id="expandSections"
            type="button"
            onclick="toggleDetailsOpen(true)"
          />
        </label>

        <label
          for="collapseSections"
          title="Collapse all sections"
          class="icon-text"
        >
          &#xF0AA6;
          <input
            id="collapseSections"
            type="button"
            onclick="toggleDetailsOpen(false)"
          />
        </label>

        <div id="filterSection" style="display: none;">

          <label
            for="showItems[boss]"
            title="Items dropped by Boss enemies (excluding rewards from Remembrances)"
          >
            Boss
            <input
              type="checkbox"
              id="showItems[boss]"
              onclick="updateItemFilters('boss', this.checked)"
              checked
            />
          </label>

          <label
            for="showItems[chest]"
            title="Items obtained through NPC interactions or looted from chests, bodies, etc..."
          >
            Chest
            <input
              type="checkbox"
              id="showItems[chest]"
              onclick="updateItemFilters('chest', this.checked)"
              checked
            />
          </label>

          <label
            for="showItems[foe]"
            title="Items obtained through farming"
          >
            Foe
            <input
              type="checkbox"
              id="showItems[foe]"
              onclick="updateItemFilters('foe', this.checked)"
              checked
            />
          </label>

          <label
            for="showItems[invader]"
            title="Items obtained by defeating an NPC invader"
          >
            <span>
              Invader
            </span>
            <input
              type="checkbox"
              id="showItems[invader]"
              onclick="updateItemFilters('invader', this.checked)"
              checked
            />
          </label>

          <label
            for="showItems[merchant]"
            title="Items purchased from merchants (including Boss Remembrances)"
          >
            Merchant
            <input
              type="checkbox"
              id="showItems[merchant]"
              onclick="updateItemFilters('merchant', this.checked)"
              checked
            />
          </label>

          <label
            for="showItems[quest]"
            title="Items obtained as rewards for progressing an NPC's quest"
          >
            Quest
            <input
              type="checkbox"
              id="showItems[quest]"
              onclick="updateItemFilters('quest', this.checked)"
              checked
            />
          </label>

          <label
            for="showItems[scarab]"
            title="Items obtained by destroying Teardrop Scarabs"
          >
            Scarab
            <input
              type="checkbox"
              id="showItems[scarab]"
              onclick="updateItemFilters('scarab', this.checked)"
              checked
            />
          </label>

        </div>

      </form>

      <section id="completionProgress">
        <!-- Populated with the savefile analysis results
         TODO: make this the <dl> wrapper
        -->
      </section>
    </section>

  </main>

  <footer>
    <a target="_blank"
      href="https://github.com/vlntnwbr/elden-ring-progression-tracker.github.io"
    >
      See project on GitHub
    </a>
  </footer>
</body>

</html>
