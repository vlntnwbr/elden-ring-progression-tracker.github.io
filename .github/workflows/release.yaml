name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup build environment
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n '1,5s/.*major: \([0-9]*\), minor: \([0-9]*\), patch: \([0-9]*\).*/\1.\2.\3/p' index.js)
          ARTIFACT=".build/elden-ring-progression-tracker.tar.gz"
          if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "Error: Release $VERSION already exists." >&2
              exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Determined v$VERSION --> $ARTIFACT"
      
      - name: Package
        env:
          ARTIFACT: ${{ steps.setup.outputs.artifact }}
        run: .build/package.sh github "$ARTIFACT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.setup.outputs.version }}
          ARTIFACT: ${{ steps.setup.outputs.artifact }}
        run: |
          gh release create "$VERSION" \
            "$ARTIFACT" \
            --title "v$VERSION" \
            --generate-notes